<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kernic studio</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="side-head">
      <span class="logo">kernic<span class="logo-dot">◆</span></span>
      <span class="tagline">studio</span>
    </header>

    <section class="group">
      <label class="group-label" for="sysname">System name</label>
      <input id="sysname" type="text" spellcheck="false" placeholder="my-brand">
    </section>

    <section class="group">
      <div class="group-label">Theme</div>
      <div id="vibes" class="chip-row"></div>
    </section>

    <section class="group" id="looksSection">
      <div class="group-label" id="looksLabel">Looks <span class="hint">one click, done</span></div>
      <div id="looksGrid"></div>
      <button id="shuffle" class="btn ghost small">✦ Surprise me</button>
      <div id="historySection" style="display:none">
        <div class="group-label">Recent shuffles <span class="hint">this session only</span></div>
        <div id="historyStrip"></div>
      </div>
    </section>

    <details id="fineTune">
      <summary>Fine-tune <span class="hint">for pros</span></summary>

    <section class="group">
      <div class="group-label">Primary hue <span id="hueVal" class="hint"></span></div>
      <input id="hue" type="range" min="0" max="359" value="220">
      <div class="row">
        <button id="randomize" class="btn ghost small">Randomize</button>
        <button id="rerollAccent" class="btn ghost small">Reroll accent</button>
      </div>
    </section>

    <section class="group">
      <label class="group-label" for="harmony">Accent harmony</label>
      <select id="harmony">
        <option value="analogous">Analogous · +40° safe & cohesive</option>
        <option value="complementary">Complementary · +180° punchy</option>
        <option value="triadic">Triadic · +120° playful</option>
        <option value="monochrome">Monochrome · quiet luxury</option>
      </select>
    </section>

    <section class="group">
      <div class="group-label">Neutral tint</div>
      <div id="tintRow" class="seg">
        <button data-tint="match">Match</button>
        <button data-tint="warm">Warm</button>
        <button data-tint="cool">Cool</button>
        <button data-tint="pure">Pure</button>
      </div>
    </section>

    <section class="group">
      <label class="group-label" for="fHeading">Heading font</label>
      <div class="combo">
        <input id="fHeading" type="text" role="combobox" aria-expanded="false" aria-controls="fHeadingList"
               aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off" spellcheck="false"
               placeholder="Search Google Fonts…">
        <div class="combo-pop" id="fHeadingPop" hidden>
          <ul class="combo-list" id="fHeadingList" role="listbox" aria-label="Heading font results"></ul>
          <div class="combo-meta" id="fHeadingMeta" hidden></div>
        </div>
      </div>

      <label class="group-label" for="fBody">Body font</label>
      <div class="combo">
        <input id="fBody" type="text" role="combobox" aria-expanded="false" aria-controls="fBodyList"
               aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off" spellcheck="false"
               placeholder="Search Google Fonts…">
        <div class="combo-pop" id="fBodyPop" hidden>
          <ul class="combo-list" id="fBodyList" role="listbox" aria-label="Body font results"></ul>
          <div class="combo-meta" id="fBodyMeta" hidden></div>
        </div>
      </div>

      <label class="group-label" for="fMono">Mono font</label>
      <div class="combo">
        <input id="fMono" type="text" role="combobox" aria-expanded="false" aria-controls="fMonoList"
               aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off" spellcheck="false"
               placeholder="Search Google Fonts…">
        <div class="combo-pop" id="fMonoPop" hidden>
          <ul class="combo-list" id="fMonoList" role="listbox" aria-label="Mono font results"></ul>
          <div class="combo-meta" id="fMonoMeta" hidden></div>
        </div>
      </div>
    </section>

    <section class="group">
      <div class="group-label">Corners</div>
      <div id="radiusRow" class="seg"></div>
      <label class="group-label" for="ratio">Type scale ratio</label>
      <select id="ratio"></select>
    </section>

    </details>

    <footer class="side-foot">
      <div class="foot-row">
        <button id="save" class="btn primary">Save</button>
        <button id="importBtn" class="btn ghost">Import</button>
        <div class="export-wrap">
          <button id="exportBtn" class="btn ghost">Export ▾</button>
          <div id="exportDropdown" class="export-dropdown">
            <button data-format="css">CSS variables</button>
            <button data-format="tailwind">Tailwind config</button>
            <button data-format="json">JSON</button>
          </div>
        </div>
      </div>
      <div id="status" class="status"></div>
    </footer>
  </aside>

  <main id="main">
    <div id="previewBar">
      <span class="bar-title">Live preview</span>
      <div class="bar-controls">
        <div id="contrastIndicator" class="contrast-indicator" title="WCAG contrast ratio"></div>
        <div class="seg mini" id="viewportRow">
          <button data-vp="desktop" class="on" title="Desktop viewport">Desktop</button>
          <button data-vp="phone" title="Phone viewport (390px)">Phone</button>
        </div>
        <div class="mode-toggle" id="modeRow">
          <button data-mode="light" class="on">☀ Light</button>
          <button data-mode="dark">☾ Dark</button>
        </div>
      </div>
    </div>
    <div id="ramps"></div>
    <div id="preview" dir="ltr"></div>
  </main>
</div>
<div id="importModal" class="modal-overlay">
  <div class="modal">
    <h3>Import tokens</h3>
    <p class="modal-desc">Paste CSS variables, a DESIGN.md table, or a kernic JSON system.</p>
    <textarea id="importInput" rows="10" placeholder=":root { --color-primary-500: #2563eb; ... }"></textarea>
    <div class="modal-actions">
      <button id="importCancel" class="btn ghost">Cancel</button>
      <button id="importApply" class="btn primary">Import</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
